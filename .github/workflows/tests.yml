# Every push and pull request: the unit tests, the planted faults of the example, and the example run
# end to end with fake sessions. Standard library only; no secrets, no network, no model.
name: tests
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests
        run: python -m unittest -v
      - name: Every planted fault of the example is caught
        run: python -m gated_delivery faults examples/service-config/faults.json
      - name: The example, every path, with fake sessions
        run: python examples/service-config/demo.py
